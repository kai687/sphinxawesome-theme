name: linkcheck
on:
  pull_request:
    paths:
      - 'docs/**/*.rst'
      - 'docs/**/*.md'
      - 'docs/conf.py'

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: "3.14.7"
          enable-cache: true
      - name: Check links
        run: uv run --locked --no-default-groups --group docs sphinx-build -b linkcheck -aWTE docs docs/public/_links
        env:
          DOCSEARCH_APP_ID: ${{ vars.DOCSEARCH_APP_ID }}
          DOCSEARCH_API_KEY: ${{ vars.DOCSEARCH_API_KEY }}
          DOCSEARCH_INDEX_NAME: ${{ vars.DOCSEARCH_INDEX_NAME }}
