name: Index the docs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [site_deployed]

jobs:
  index:
    name: Crawl the docs and upload to Algolia
    runs-on: ubuntu-latest
    env:
      MINI_CRAWLER_VERSION: 0.2.0
      ALGOLIA_RS_VERSION: 0.1.3
      MIN_RECORDS: 190
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Cache CLI tools
        id: cache-cli-tools
        uses: actions/cache@v6
        with:
          path: .tools
          key: ${{ runner.os }}-cli-tools-mini-crawler-${{ env.MINI_CRAWLER_VERSION }}-algolia-rs-${{ env.ALGOLIA_RS_VERSION }}

      - name: Add CLI tools to PATH
        run: |
          echo "${GITHUB_WORKSPACE}/.tools/mini-crawler/bin" >> "${GITHUB_PATH}"
          echo "${GITHUB_WORKSPACE}/.tools/algolia-rs/bin" >> "${GITHUB_PATH}"

      - name: Install mini-crawler
        if: steps.cache-cli-tools.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="mini-crawler_${MINI_CRAWLER_VERSION}_linux_amd64.tar.gz"
          install_dir="${GITHUB_WORKSPACE}/.tools/mini-crawler/bin"
          mkdir -p "${install_dir}"
          gh release download "v${MINI_CRAWLER_VERSION}" \
            --repo kai687/mini-crawler \
            --pattern "${archive}" \
            --pattern checksums.txt
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" -C "${install_dir}" mini-crawler

      - name: Install algolia-rs
        if: steps.cache-cli-tools.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="algolia-rs-x86_64-unknown-linux-gnu.tar.xz"
          install_dir="${GITHUB_WORKSPACE}/.tools/algolia-rs/bin"
          mkdir -p "${install_dir}"
          gh release download "v${ALGOLIA_RS_VERSION}" \
            --repo kai687/algolia-rs \
            --pattern "${archive}" \
            --pattern "${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          tar -xJf "${archive}" -C "${install_dir}" --strip-components=1 \
            "algolia-rs-x86_64-unknown-linux-gnu/algolia-rs"

      - name: Check extraction script
        run: mini-crawler script check --script .github/crawler/sphinxawesome.star

      - name: Check Algolia settings drift
        env:
          ALGOLIA_APPLICATION_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.INDEXING_API_KEY }}
          INDEX_NAME: ${{ vars.INDEX_NAME }}
        run: algolia-rs settings diff "${INDEX_NAME}" --file .github/crawler/settings.json

      - name: Crawl the docs
        run: |
          mini-crawler crawl sitemap https://sphinxawesome.xyz/sitemap.xml \
            --script .github/crawler/sphinxawesome.star \
            --workers 2 \
            --output records.jsonl
          count="$(wc -l < records.jsonl)"
          echo "Crawled ${count} records"
          if [ "${count}" -lt "${MIN_RECORDS}" ]; then
            echo "::error::Only ${count} records, expected at least ${MIN_RECORDS}. Not touching the index."
            exit 1
          fi

      - name: Replace records in Algolia index
        env:
          ALGOLIA_APPLICATION_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.INDEXING_API_KEY }}
          INDEX_NAME: ${{ vars.INDEX_NAME }}
        run: algolia-rs records replace "${INDEX_NAME}" --file records.jsonl

      - name: Update index settings
        env:
          ALGOLIA_APPLICATION_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.INDEXING_API_KEY }}
          INDEX_NAME: ${{ vars.INDEX_NAME }}
        run: algolia-rs settings apply "${INDEX_NAME}" --file .github/crawler/settings.json
