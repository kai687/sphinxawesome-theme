[tools]
python = "3.14.7"
uv = "0.13.0"
node = "26.11.1"
pnpm = "12.11.2"

[tasks.format]
description = "Format Python code"
run = "uv run --locked --no-default-groups --group dev ruff format ."

[tasks."format-check"]
description = "Check Python formatting"
run = "uv run --locked --no-default-groups --group dev ruff format --check ."

[tasks.lint]
description = "Lint Python code"
run = "uv run --locked --no-default-groups --group dev --group docs ruff check ."

[tasks.typecheck]
description = "Type-check Python code"
run = "uv run --locked --no-default-groups --group dev --group docs ty check"

[tasks.quality]
description = "Run linting and type checking"
run = "uv run --locked --no-default-groups --group dev --group docs ruff check . && uv run --locked --no-default-groups --group dev --group docs ty check"

[tasks.test]
description = "Run tests with Python 3.14"
run = "uv run --locked --python 3.14.7 --no-default-groups --group dev --group docs pytest --cov"

[tasks."test-3.10"]
description = "Run tests with Python 3.10 in an isolated environment"
run = "uv run --locked --isolated --python 3.10.21 --no-default-groups --group dev --group docs pytest --cov"

[tasks."test-3.14"]
description = "Run tests with Python 3.14"
run = "uv run --locked --python 3.14.7 --no-default-groups --group dev --group docs pytest --cov"

[tasks."docs:build"]
description = "Build documentation"
run = "uv run --locked --no-default-groups --group docs sphinx-build -b dirhtml -aWTE docs docs/public"

[tasks."docs:live"]
description = "Serve documentation with live reload"
run = "uv run --locked --no-default-groups --group docs sphinx-autobuild -q -b dirhtml -A mode='development' -aTE docs docs/public --ignore docs/jupyter_execute --ignore docs/public"

[tasks."docs:links"]
description = "Check documentation links"
run = "uv run --locked --no-default-groups --group docs sphinx-build -b linkcheck -aWTE docs docs/public/_links"
